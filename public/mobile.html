<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
  <title>Add Your Name to the Galaxy</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="mobile">
  <main>
    <h1>Add your name to the galaxy</h1>
    <p class="hint">Write your name or a word in your own script on plain paper, then photograph it here.</p>

    <label class="capture-box" for="photo-input">
      <span id="capture-label">Tap to photograph</span>
      <img id="preview" hidden alt="preview" />
    </label>
    <input id="photo-input" type="file" accept="image/*" capture="environment" hidden />

    <label class="field">
      Color
      <input id="color-input" type="color" value="#7fd6ff" />
    </label>

    <label class="field">
      Transparency
      <input id="transparency-input" type="range" min="0.1" max="1.0" step="0.05" value="0.9" />
    </label>

    <label class="field">
      Glow intensity
      <input id="intensity-input" type="range" min="1.0" max="5.0" step="0.1" value="2.0" />
    </label>

    <button id="submit-btn" disabled>Send to the galaxy</button>
    <p id="status"></p>
    <p class="count">Participants so far: <span id="count">0</span></p>
  </main>
  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/mobile.js"></script>
</body>
</html>
