<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="robots" content="noindex, nofollow" />
  <title>Counting Cultural Stars: Shared Sky</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body class="display">
  <canvas id="scene"></canvas>
  <div id="hud">
    <span id="participant-count">0</span> participants
  </div>
  <div id="newEntryToast" hidden></div>

  <div id="operatorPanel" hidden>
    <div class="op-title">Operator &middot; press ` to hide</div>
    <label>
      Rotation speed
      <input id="opRotation" type="range" min="0" max="3" step="0.05" value="1" />
    </label>
    <label>
      Bloom offset
      <input id="opBloom" type="range" min="-0.5" max="1.5" step="0.05" value="0" />
    </label>
    <button id="opReveal" type="button">Run the reveal (R)</button>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/sky.js"></script>
</body>
</html>
