<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Communal Volumetric Cultural Text Galaxy</title>
  <link rel="stylesheet" href="/css/style.css" />
  <script type="importmap">
    {
      "imports": {
        "three": "/vendor/three/build/three.module.js",
        "three/addons/": "/vendor/three/examples/jsm/"
      }
    }
  </script>
</head>
<body class="display">
  <canvas id="scene"></canvas>
  <div id="hud">
    <span id="participant-count">0</span> participants
  </div>
  <div id="newEntryToast" hidden></div>

  <div id="operatorPanel" hidden>
    <div class="op-title">Operator &middot; press ` to hide</div>
    <label>
      Rotation speed
      <input id="opRotation" type="range" min="0.2" max="3" step="0.05" value="1" />
    </label>
    <label>
      Bloom offset
      <input id="opBloom" type="range" min="-0.5" max="1.5" step="0.05" value="0" />
    </label>
    <label>
      Nebula baseline
      <input id="opNebula" type="range" min="0" max="800" step="10" value="250" />
    </label>
    <label>
      Trail length
      <input id="opTrail" type="range" min="0" max="0.97" step="0.01" value="0.85" />
    </label>
    <button id="opCopyLink" type="button">Copy link with these settings</button>
    <p id="opCopyStatus"></p>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script type="module" src="/js/display.js"></script>
</body>
</html>
